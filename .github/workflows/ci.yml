# Integración continua: se ejecuta en cada PR y es reutilizada por el pipeline de despliegue.
# Si cualquier job falla, el despliegue (cd.yml) no se ejecuta.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [develop, qa, main] # en estas ramas CI corre dentro de cd.yml
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, pruebas unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes (con umbral de cobertura)
        run: npm run test:ci

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('### Cobertura\n\n| Métrica | % |\n|---|---|\n'+Object.entries(t).map(([k,v])=>'| '+k+' | '+v.pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build de verificación
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  security-rules:
    name: Reglas de seguridad de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Probar reglas contra el emulador
        run: npm run test:rules

  e2e:
    name: E2E con emuladores (Chromium escritorio y móvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E
        run: npm run test:e2e:emulator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ci-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  dependency-audit:
    name: Auditoría de dependencias de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: npm audit (solo dependencias que llegan al navegador)
        run: npm audit --omit=dev --audit-level=high
